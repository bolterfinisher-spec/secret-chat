<!DOCTYPE html>
<html>
<head>
<title>SECRET CHAT</title>
</head>
<body style="background:black; color:#00ff88; font-family:monospace;">

<div style="width:500px; margin:50px auto;">

<h2>SECURE CHANNEL</h2>

<div id="messages" style="height:300px; border:1px solid #00ff88; overflow-y:auto; padding:10px;"></div>

<input id="msg" placeholder="TYPE MESSAGE..." style="width:100%; padding:10px; margin-top:10px; background:black; color:#00ff88; border:1px solid #00ff88;">

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const username = localStorage.getItem("username");

socket.emit("join", username);

socket.on("message", (msg) => {

const div = document.createElement("div");

div.textContent = msg;

document.getElementById("messages").appendChild(div);

});

document.getElementById("msg").addEventListener("keypress", function(e){

if(e.key === "Enter"){

socket.emit("chat", this.value);

this.value = "";

}

});

</script>

</body>
</html>
