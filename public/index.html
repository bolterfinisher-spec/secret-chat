<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLADE CORPORATION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
    <div class="logo">BLADE CORPORATION</div>
    <div class="subtitle">secure network initializing...</div>
</div>

<!-- Login Panel -->
<div id="loginPanel">

    <h2>ACCESS TERMINAL</h2>

    <input 
        type="text" 
        id="username" 
        placeholder="USERNAME"
        autocomplete="off"
    >

    <input 
        type="password" 
        id="password" 
        placeholder="PASSWORD"
        autocomplete="off"
    >

    <button onclick="login()">
        ACCESS
    </button>

</div>

<!-- Chat Container -->
<div id="chatContainer">

    <!-- Sidebar -->
    <div id="sidebar">
        <h3>BLADE NETWORK</h3>
    </div>

    <!-- Chat Area -->
    <div id="chatArea">

        <div id="messages"></div>

        <div id="inputArea">
            <input
                type="text"
                id="messageInput"
                placeholder="enter message..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
        </div>

    </div>

</div>

<!-- Socket.IO -->
<script src="/socket.io/socket.io.js"></script>

<!-- Client Script -->
<script src="client.js"></script>

</body>
</html>
